# The MySQL, MariaDB, PostgreSQL and SQLite jobs of hypervel/components' .github/workflows/databases.yml,
# as a reusable workflow in ipsocode/hypervel-packages-ci, where the upstream commit it mirrors is named.
# This file only says when it runs; bin/run-database-tests.sh, testbench.yaml and phpunit.xml stay here.
name: databases

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  databases:
    uses: ipsocode/hypervel-packages-ci/.github/workflows/databases.yml@7fc1b15e5073bb3ddb35b53b7d0f8e35bd4a68cb # v1
